<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1020" width="960" height="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <title>AskCharts architecture</title>
  <desc>The page in your browser talks to the app server, behind a passkey sign-in on a server. The app server fetches market data, reads the history stores and talks to your AI provider. A runner starts everything, and runs the history importers, the XRPL collector and the updater.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <style>
      .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .main { fill: #ffffff; stroke: #57606a; stroke-width: 1.6; }
      .head { font-weight: 600; font-size: 15px; }
      .sub { fill: #57606a; font-size: 13px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .line { stroke: #0969da; stroke-width: 1.6; fill: none; }
      .note { fill: #57606a; font-size: 12.5px; }
      .src { fill: #0969da; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="1019" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- you -->
  <text x="480" y="36" text-anchor="middle" class="head">You, in Chrome or Edge</text>
  <line x1="480" y1="46" x2="480" y2="84" class="line" marker-end="url(#arrow)"/>
  <text x="466" y="70" text-anchor="end" class="note">on a computer: straight to the app</text>
  <text x="494" y="70" class="note">on a server: HTTPS and a passkey</text>

  <!-- the page -->
  <rect x="40" y="88" width="880" height="140" rx="10" class="main"/>
  <text x="60" y="114" class="head">Browser: the page</text><text x="210" y="114" class="sub mono">app/public</text>
  <text x="60" y="142">Charts, drawings, intervals</text>
  <text x="60" y="164">Bar replay, paper trading</text>
  <text x="360" y="142">Indicators and Pine scripts</text>
  <text x="360" y="164">Alerts, screener, heatmap</text>
  <text x="660" y="142">Strategy tester</text>
  <text x="660" y="164">Watchlists, layouts</text>
  <text x="60" y="190">AskCharts AI panel: talks to the model and runs its chart tools on the page</text>
  <text x="60" y="212" class="sub">Settings: AskCharts AI · Stock data · Crypto data · On chain data · Updates</text>

  <line x1="480" y1="228" x2="480" y2="264" class="line" marker-end="url(#arrow)"/>
  <text x="494" y="251" class="note">/api: JSON and live event streams</text>

  <!-- the gateway -->
  <rect x="290" y="268" width="380" height="52" rx="8" class="box" stroke-dasharray="6 4"/>
  <text x="480" y="291" text-anchor="middle" class="head">Gateway: passkey sign-in</text>
  <text x="480" y="310" text-anchor="middle" class="sub mono">gateway/</text>
  <text x="276" y="299" text-anchor="end" class="note">on a server only</text>

  <line x1="480" y1="320" x2="480" y2="352" class="line" marker-end="url(#arrow)"/>

  <!-- the app server -->
  <rect x="40" y="356" width="880" height="262" rx="10" class="main"/>
  <text x="60" y="382" class="head">App server</text><text x="150" y="382" class="sub mono">app/server.js, app/lib</text>
  <g>
    <text x="60" y="414" class="mono">providers.js</text><text x="210" y="414">charts and quotes</text>
    <text x="390" y="414" class="src">→ Binance · Coinbase · Kraken · Nasdaq · Yahoo · Forex Factory</text>
    <text x="60" y="442" class="mono">feeds.js</text><text x="210" y="442">your own data keys</text>
    <text x="390" y="442" class="src">→ Alpaca · Polygon, for live US stocks</text>
    <text x="60" y="470" class="mono">history.js</text><text x="210" y="470">years of bars</text>
    <text x="390" y="470" class="src">→ reads bars.sqlite, never writes it</text>
    <text x="60" y="498" class="mono">onchain.js</text><text x="210" y="498">XRPL indicators</text>
    <text x="390" y="498" class="src">→ reads xrpl.sqlite, never writes it</text>
    <text x="60" y="526" class="mono">copilot.js</text><text x="210" y="526">AskCharts AI, with</text>
    <text x="60" y="546" class="mono">agent.js</text><text x="210" y="546">your own key</text>
    <text x="390" y="526" class="src">→ Anthropic · OpenAI · xAI</text>
    <text x="60" y="574" class="mono">alerts.js</text><text x="210" y="574">alert engine</text>
    <text x="390" y="574" class="src">→ notifications, webhooks</text>
  </g>
  <text x="60" y="604" class="sub"><tspan class="mono">data/app</tspan>: your charts and settings, and your keys (each sent only to its own provider)</text>

  <!-- the runner -->
  <line x1="480" y1="660" x2="480" y2="622" class="line" marker-end="url(#arrow)"/>
  <text x="494" y="646" class="note">starts, watches, restarts</text>
  <rect x="160" y="660" width="640" height="50" rx="8" class="main"/>
  <text x="480" y="684" text-anchor="middle" class="head">Runner <tspan class="sub mono">run.mjs</tspan></text>
  <text x="480" y="701" text-anchor="middle" class="sub">hourly updates, and the requests you make from Settings</text>

  <line x1="180" y1="710" x2="180" y2="752" class="line" marker-end="url(#arrow)"/>
  <line x1="480" y1="710" x2="480" y2="752" class="line" marker-end="url(#arrow)"/>
  <line x1="780" y1="710" x2="780" y2="752" class="line" marker-end="url(#arrow)"/>

  <!-- three workers, the same size -->
  <rect x="40" y="756" width="280" height="166" rx="10" class="box"/>
  <text x="180" y="782" text-anchor="middle" class="head">History importers</text>
  <text x="58" y="810" class="mono">kraken.mjs</text><text x="160" y="810" class="src">← Kraken files + API</text>
  <text x="58" y="836" class="mono">alpaca.mjs</text><text x="160" y="836" class="src">← Alpaca, whole market</text>
  <text x="58" y="862" class="mono">binance.mjs</text><text x="160" y="862" class="src">← Binance files + API</text>
  <text x="58" y="900" class="sub">one writer at a time</text>

  <rect x="340" y="756" width="280" height="166" rx="10" class="box"/>
  <text x="480" y="782" text-anchor="middle" class="head">XRPL collector</text>
  <text x="358" y="810" class="mono">onchain/xrpl.mjs</text>
  <text x="358" y="836" class="src">← an XRP Ledger server</text>
  <text x="358" y="855" class="sub">(your own node, or s1.ripple.com)</text>
  <text x="358" y="881" class="src">← data.askcharts.pro</text>
  <text x="358" y="900" class="sub">(signed shared history)</text>

  <rect x="640" y="756" width="280" height="166" rx="10" class="box"/>
  <text x="780" y="782" text-anchor="middle" class="head">Updater</text>
  <text x="658" y="810" class="mono">update.mjs</text>
  <text x="658" y="836" class="src">← GitHub releases</text>
  <text x="658" y="862">checks the signature and</text>
  <text x="658" y="881">every file; puts the old version</text>
  <text x="658" y="900">back if the new one won't start</text>

  <!-- the stores -->
  <line x1="180" y1="922" x2="180" y2="948" class="line" marker-end="url(#arrow)"/>
  <line x1="480" y1="922" x2="480" y2="948" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(180 952)">
    <path d="M-62 6 v28 a62 9 0 0 0 124 0 v-28" class="box"/>
    <ellipse cx="0" cy="6" rx="62" ry="9" class="box"/>
    <text y="30" text-anchor="middle" class="mono">bars.sqlite</text>
  </g>
  <text x="180" y="1008" text-anchor="middle" class="note">Kraken, Binance, US stocks</text>
  <g transform="translate(480 952)">
    <path d="M-62 6 v28 a62 9 0 0 0 124 0 v-28" class="box"/>
    <ellipse cx="0" cy="6" rx="62" ry="9" class="box"/>
    <text y="30" text-anchor="middle" class="mono">xrpl.sqlite</text>
  </g>
  <text x="480" y="1008" text-anchor="middle" class="note">ledger by ledger, 90 days</text>
</svg>
